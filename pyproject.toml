[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ai_weather"
version = "0.0.1"
description = "Demos are designed to provide an interactive learning experience over the AI weather training program, so we can move from concepts to pilot evaluation as part of an international community of practice. The 2026 program goals aim to help participants from weather and agricultural government institutions think through together how they could pilot an AI-based weather model in their operational workflows as part of forecast-to-farmer decision support. To achieve this, we have a track-based learning approach to engage participants (some sessions are joint across weather and agriculture, while others are separate to allow a deeper dive across the pipeline)."
authors = [
  { name = "HCWF" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["ai_weather"]
force_sort_within_sections = true
