# ============================================================
# AI WEATHER —  Lesson Template
# ============================================================

# --- Site Metadata ---
title: "AI Weather"
description: "A modern, hands-on lesson on applying AI to weather forecasting using Python."
author: "Mesfin Diro"
email: "mesfin.diro@aau.edu.et"
url: "https://mesfindiro.github.io"
baseurl: "/ai_weather"
repository: "mesfindiro/ai_weather"
license: "CC-BY 4.0"

# --- Build Settings ---
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    block:
      line_numbers: false
  smart_quotes: ["apos", "apos", "quot", "quot"]

# --- SCSS ---
sass:
  sass_dir: _sass
  style: compressed

# --- Collections ---
collections:
  episodes:
    output: true
    permalink: /episodes/:slug/

# --- Defaults ---
defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      toc: true
  - scope:
      path: ""
      type: "episodes"
    values:
      layout: "episode"
      toc: true

# --- Plugins ---
  plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# --- Exclusions ---
exclude:
  - Makefile
  - bin/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - requirements.txt
  - "*.map"
  - README.md
  - CONTRIBUTING.md
  - CITATION

# --- Features ---
mathjax: true