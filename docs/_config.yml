# docs/_config.yml
title: "AI Weather"
description: "A modern, state-of-the-art lesson on AI applications in Weather Forecasting."
url: "https://mesfindiro.github.io" # Update with your actual GitHub Pages URL
baseurl: "/ai_weather" # Update with your repo name, or leave blank if root

# Modern Markdown & Syntax Highlighting
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    block:
      line_numbers: false

# SOTA SCSS Configuration
sass:
  sass_dir: _sass
  style: compressed

# Modern Lesson Collection
collections:
  episodes:
    output: true
    permalink: /episodes/:title/

# Default Front Matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "episodes"
    values:
      layout: "default"

# Native GitHub Pages Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap